
name: Deploy Torn Login Function

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/torn-login/**'
      - '.github/workflows/deploy-torn-login.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy function
        run: supabase functions deploy torn-login --project-ref nzrrqchdewvycrprbsos --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
